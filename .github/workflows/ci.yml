name: Clean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out pinned sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ninja-build \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libboost-test-dev

      - name: Verify source formatting
        run: git diff --check

      - name: Configure from a fresh checkout
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build pinned Solidity and puya-sol
        run: cmake --build build --parallel 2

      - name: Run native and CLI tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify checkout remained clean
        run: |
          git diff --exit-code
          if test -n "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            git status --short --ignore-submodules=none
            exit 1
          fi

      - name: Upload provenance manifest
        if: ${{ always() && hashFiles('build/puya-sol-build-manifest.txt') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: puya-sol-build-manifest-${{ github.sha }}
          path: build/puya-sol-build-manifest.txt
          if-no-files-found: error
          retention-days: 30
