[pytest]
# Morpho-blue tests deploy 5+ apps per test (morpho + mocks + orch) and
# can flake under localnet throughput load. --reruns retries failing
# tests up to N times; the failures stabilize at 0 with N=2.
addopts = --reruns 2 --reruns-delay 1
markers =
    localnet: tests that require a localnet (algokit localnet start)
